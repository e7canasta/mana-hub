services:
  postgres:
    image: postgres:17-alpine
    container_name: mana-hub-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mana_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mana_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
