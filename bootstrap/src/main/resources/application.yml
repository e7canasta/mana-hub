server:
  port: 8080

spring:
  application:
    name: mana-hub
  datasource:
    url: jdbc:postgresql://localhost:5432/mana_hub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    # Prendido.
    #
    # Estuvo en `false` con diecinueve migraciones en el árbol, que es la peor
    # combinación posible: el repositorio parece tener control de esquema y no lo
    # tiene, así que nadie puede saber si la base coincide con el código. Se
    # descubre cuando una consulta falla con `column ... does not exist`.
    #
    # No estaba apagado por capricho: había **versiones duplicadas** (dos V3 y
    # dos V10) y Flyway se niega a arrancar con eso. Renumeradas a V3.1 y V10.1,
    # que conserva el orden original.
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-null-for-primitives: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

nats:
  enabled: false
  url: nats://localhost:4222

bridge:
  url: http://localhost:8090
  webhook:
    url: http://localhost:8090/webhooks/policy-change
  target:
    url: http://localhost:8080

hub:
  integration:
    scene-events:
      ignore:
        - SignalLost
        - SignalRecovered

logging:
  level:
    com.hub: INFO
    org.flywaydb: INFO
    com.manahive: INFO
