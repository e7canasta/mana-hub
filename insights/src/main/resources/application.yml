server:
  port: 8081

spring:
  application:
    name: mana-insights
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/mana_hub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

insights:
  hub-url: ${INSIGHTS_HUB_URL:http://localhost:8080}
  timezone: America/Argentina/Buenos_Aires
  sleep-window:
    start: "19:00"
    end: "12:00"
  baseline-min-days: 7
  walking-meters-per-minute: 50.0
  deep-sleep-after-minutes: 10
  rollup:
    enabled: false
    cron: "0 0 6 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.hub.insights: INFO
